# Nginx configuration for CaRide TransactPay Proxy
# Install certbot with: sudo certbot --nginx -d proxy.caride.ng

server {
    listen 80;
    listen [::]:80;
    server_name proxy.caride.ng;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name proxy.caride.ng;

    # SSL Certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/proxy.caride.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.caride.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Request limits
    client_max_body_size 2M;

    # Reverse proxy to local Node.js proxy service
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
