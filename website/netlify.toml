[build]
  command   = "npm run build"
  publish   = "dist"

# Clean URLs — strip .html for Play Store required paths
[[redirects]]
  from   = "/privacypolicy"
  to     = "/privacypolicy.html"
  status = 200

[[redirects]]
  from   = "/accountdeletion"
  to     = "/accountdeletion.html"
  status = 200

# www → apex redirect (optional, remove if you prefer www)
[[redirects]]
  from   = "https://www.caride.ng/*"
  to     = "https://caride.ng/:splat"
  status = 301
  force  = true
