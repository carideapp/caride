workflows:
  ios-release:
    name: CaRide iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.29.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fetch Flutter dependencies
        script: |
          cd apps/caride
          flutter pub get
      - name: Build iOS IPA
        script: |
          cd apps/caride
          flutter build ipa --release --no-codesign
    artifacts:
      - apps/caride/build/ios/ipa/*.ipa
      - apps/caride/build/ios/xcarchive/*.xcarchive
      - build/ios/ipa/*.ipa
